name: Test, publish and verify GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run build
      - run: python -m pip install playwright==1.56.0
      - name: Test actual JSON in mobile Chromium and Safari engine
        run: python tests/browser.py --engine both
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-previews
          path: output/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check live HTTP and public assets
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python scripts/check_live.py "$SITE_URL"
      - run: python -m pip install playwright==1.56.0
      - name: Verify the actual published page with Safari engine
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/browser.py --engine webkit --base-url "$SITE_URL"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-mobile-preview
          path: output/
